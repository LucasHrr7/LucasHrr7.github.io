<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Henrique · Engenheiro de Software</title>
    <meta
      name="description"
      content="Portfólio de Lucas Henrique Rabelo, Engenheiro de Software em Brasília – DF."
    />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do Vue carregar, evitando o "piscar" de cor
      try {
        const t = localStorage.getItem('theme')
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
